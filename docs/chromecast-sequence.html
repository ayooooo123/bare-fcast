<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bare-fcast · Chromecast CASTV2 connect and load</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · bare-fcast</p>
    <h1>Chromecast CASTV2 — from TLS socket to playing media</h1>

    <svg viewBox="0 0 1000 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chromecast-sequence-title chromecast-sequence-desc">
      <title id="chromecast-sequence-title">bare-fcast Chromecast connect and load sequence</title>
      <desc id="chromecast-sequence-desc">Sequence diagram with three participants: the bare-fcast sender, the Chromecast platform receiver, and the launched default media receiver app. The sender opens a TLS socket, sends CONNECT, maintains a heartbeat loop, requests receiver status and launches the media app, learns the transport id from RECEIVER_STATUS, connects to that transport, sends LOAD, and receives MEDIA_STATUS as the success response.</desc>

      <defs>
        <pattern id="chromecast-sequence-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="chromecast-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="chromecast-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
        <marker id="chromecast-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#chromecast-sequence-dots)" opacity="0.55"/>

      <!-- Actors -->
      <rect x="80" y="56" width="200" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="180" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bare-fcast</text>
      <text x="180" y="90" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sender-0</text>

      <rect x="420" y="56" width="200" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Platform receiver</text>
      <text x="520" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">receiver-0 · :8009</text>

      <rect x="760" y="56" width="200" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="860" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Media receiver app</text>
      <text x="860" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CC1AD845 · transport-N</text>

      <!-- Lifelines -->
      <line x1="180" y1="100" x2="180" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="100" x2="520" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="100" x2="860" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="176" y="132" width="8" height="348" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="516" y="168" width="8" height="216" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="856" y="416" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 1. TLS connect -->
      <line x1="184" y1="136" x2="512" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="128" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">TLS connect</text>
      <text x="348" y="150" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">self-signed · rejectUnauthorized: false</text>

      <!-- 2. CONNECT -->
      <line x1="184" y1="172" x2="512" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="164" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">CONNECT</text>
      <text x="348" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tp.connection</text>

      <!-- LOOP fragment: heartbeat -->
      <rect x="152" y="204" width="396" height="92" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="152" y="204" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="176" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="208" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[every 5s · ongoing · 3 misses → disconnect]</text>

      <line x1="184" y1="248" x2="512" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#chromecast-sequence-arrow-open)"/>
      <text x="348" y="240" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">PING</text>
      <text x="348" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tp.heartbeat</text>

      <line x1="512" y1="284" x2="184" y2="284" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="278" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">PONG</text>

      <!-- 3. GET_STATUS -->
      <line x1="184" y1="324" x2="512" y2="324" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="316" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">GET_STATUS</text>
      <text x="348" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">receiver</text>

      <!-- 4. LAUNCH -->
      <line x1="184" y1="356" x2="512" y2="356" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="352" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">LAUNCH appId CC1AD845</text>

      <!-- 5. RECEIVER_STATUS return -->
      <line x1="512" y1="384" x2="184" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="348" y="378" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">RECEIVER_STATUS</text>
      <text x="348" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">apps[].transportId ← the whole point of this round trip</text>

      <!-- 6. CONNECT to transport -->
      <line x1="184" y1="424" x2="852" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="690" y="416" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">CONNECT to transport-N</text>
      <text x="690" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tp.connection</text>

      <!-- 7. LOAD -->
      <line x1="184" y1="460" x2="852" y2="460" stroke="#4f5d75" stroke-width="1" marker-end="url(#chromecast-sequence-arrow)"/>
      <text x="690" y="452" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">LOAD contentId · contentType · autoplay</text>
      <text x="690" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">media · debounced 1s</text>

      <!-- 8. MEDIA_STATUS — headline success -->
      <line x1="852" y1="500" x2="184" y2="500" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#chromecast-sequence-arrow-accent)"/>
      <text x="690" y="494" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MEDIA_STATUS · PLAYING</text>

      <!-- Caption -->
      <text x="80" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NAMESPACES</text>
      <text x="216" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Every arrow is a protobuf CastMessage, length-prefixed and hand-encoded. Namespaces above are short for urn:x-cast:com.google.cast.*</text>
      <text x="80" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHY TWO CONNECTS</text>
      <text x="216" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The first CONNECT reaches the platform; the media app does not exist yet. LAUNCH creates it, RECEIVER_STATUS names it, and only then can it be addressed.</text>
    </svg>
  </div>
</body>
</html>
